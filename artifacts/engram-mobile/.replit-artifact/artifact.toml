kind = "mobile"
previewPath = "/mobile/"
title = "ENGRAM Mobile"
version = "1.0.0"
id = "artifacts/engram-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 25915

[services.development]
run = "pnpm --filter @workspace/engram-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/engram-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/engram-mobile", "run", "serve" ]

[services.env]
PORT = "25915"
BASE_PATH = "/mobile/"
