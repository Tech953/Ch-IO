<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <title>ENGRAM — Settings</title>
    <style>
      :root {
        --bg: #070b12;
        --panel: #0d1521;
        --border: #15324a;
        --cyan: #34e2e2;
        --cyan-dim: #1b6f78;
        --text: #cfe9ef;
        --muted: #6f8a96;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: "Rajdhani", "Inter", system-ui, sans-serif;
        font-size: 14px;
      }
      h1 {
        font-size: 18px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--cyan);
        margin: 0 0 4px;
      }
      p.sub {
        color: var(--muted);
        margin: 0 0 20px;
        font-size: 12px;
      }
      fieldset {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        margin: 0 0 16px;
        background: var(--panel);
      }
      legend {
        color: var(--cyan);
        padding: 0 8px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-size: 11px;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      input[type="text"],
      input[type="password"],
      input[type="url"],
      select {
        width: 100%;
        padding: 9px 10px;
        background: #060a10;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--cyan);
      }
      .mode-row {
        display: flex;
        gap: 18px;
        margin-bottom: 4px;
      }
      .mode-row label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        color: var(--text);
        font-size: 14px;
        cursor: pointer;
      }
      .hint {
        color: var(--muted);
        font-size: 11px;
        margin-top: 6px;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 8px;
      }
      button {
        padding: 9px 18px;
        border-radius: 6px;
        border: 1px solid var(--cyan-dim);
        background: transparent;
        color: var(--text);
        cursor: pointer;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 12px;
      }
      button.primary {
        background: var(--cyan);
        color: #04161a;
        border-color: var(--cyan);
        font-weight: 600;
      }
      button:hover {
        border-color: var(--cyan);
      }
      .hidden {
        display: none;
      }
      #status {
        color: var(--muted);
        font-size: 12px;
        min-height: 16px;
      }
      .about-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 4px 0;
      }
      .about-label {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.04em;
        width: 72px;
        flex-shrink: 0;
      }
      .about-value {
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
      }
      .update-actions {
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Model Connection</h1>
    <p class="sub" id="subtitle"></p>

    <fieldset>
      <legend id="mode-legend"></legend>
      <div class="mode-row">
        <label><input type="radio" name="mode" value="offline" /> <span id="mode-offline"></span></label>
        <label><input type="radio" name="mode" value="online" /> <span id="mode-online"></span></label>
      </div>
    </fieldset>

    <fieldset>
      <legend id="language-legend"></legend>
      <label for="locale" id="language-label"></label>
      <select id="locale"></select>
    </fieldset>

    <fieldset id="offline-panel">
      <legend id="offline-legend"></legend>
      <label for="offline-base" id="offline-base-label"></label>
      <input id="offline-base" type="url" placeholder="http://localhost:11434/v1" />
      <label for="offline-model" id="offline-model-label"></label>
      <input id="offline-model" type="text" placeholder="llama3.1" />
      <p class="hint" id="offline-hint"></p>
    </fieldset>

    <fieldset id="online-panel">
      <legend id="online-legend"></legend>
      <label for="online-base" id="online-base-label"></label>
      <input id="online-base" type="url" placeholder="https://api.openai.com/v1" />
      <label for="online-model" id="online-model-label"></label>
      <input id="online-model" type="text" placeholder="gpt-4o-mini" />
      <label for="online-key" id="online-key-label"></label>
      <input id="online-key" type="password" autocomplete="off" />
      <p class="hint" id="key-hint"></p>
    </fieldset>

    <fieldset>
      <legend id="about-legend"></legend>
      <div class="about-row">
        <span class="about-label" id="version-label"></span>
        <span id="app-version" class="about-value">…</span>
      </div>
      <div class="about-row">
        <span class="about-label" id="updates-label"></span>
        <span id="update-status" class="about-value">…</span>
      </div>
      <div class="update-actions">
        <button id="check-updates" type="button"></button>
      </div>
    </fieldset>

    <div class="actions">
      <span id="status"></span>
      <span style="flex:1"></span>
      <button id="cancel" type="button"></button>
      <button id="save" type="button" class="primary"></button>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let currentMessages = {};
      let appInfo = null;

      function tr(key, values) {
        const template = currentMessages[key] ?? key;
        if (!values) return template;
        return template.replace(/\{(\w+)\}/g, (_m, k) =>
          values[k] == null ? `{${k}}` : String(values[k]),
        );
      }
      function setText(id, key, values) {
        $(id).textContent = tr(key, values);
      }
      function applyMode(mode) {
        $("offline-panel").classList.toggle("hidden", mode !== "offline");
        $("online-panel").classList.toggle("hidden", mode !== "online");
      }
      function applyMessages(messages) {
        currentMessages = messages;
        document.title = tr("app.settingsTitle");
        setText("title", "settings.title");
        setText("subtitle", "settings.subtitle");
        setText("mode-legend", "settings.modeLegend");
        setText("mode-offline", "settings.mode.offline");
        setText("mode-online", "settings.mode.online");
        setText("language-legend", "settings.languageLegend");
        setText("language-label", "settings.languageLegend");
        setText("offline-legend", "settings.offlineLegend");
        setText("online-legend", "settings.onlineLegend");
        setText("offline-base-label", "settings.baseUrl");
        setText("offline-model-label", "settings.model");
        setText("online-base-label", "settings.baseUrl");
        setText("online-model-label", "settings.model");
        setText("online-key-label", "settings.apiKey");
        setText("offline-hint", "settings.offlineHint");
        setText("about-legend", "settings.aboutLegend");
        setText("version-label", "settings.version");
        setText("updates-label", "settings.updates");
        setText("check-updates", "settings.checkUpdates");
        setText("cancel", "settings.cancel");
        setText("save", "settings.saveRestart");
        renderUpdateStatus(appInfo, appInfo?.updateStatus);
      }
      async function setLocaleMessages(locale) {
        const messages = await window.engram.getMessages(locale);
        applyMessages(messages);
      }
      function renderUpdateStatus(info, status) {
        const el = $("update-status");
        const btn = $("check-updates");
        if (!info || !info.updatesSupported) {
          el.textContent = tr("settings.status.unavailable");
          btn.disabled = true;
          return;
        }
        const s = status || { state: "idle" };
        switch (s.state) {
          case "checking":
            el.textContent = tr("settings.status.checking");
            btn.disabled = true;
            break;
          case "available":
            el.textContent = s.version
              ? tr("settings.status.available", { version: s.version })
              : tr("settings.status.availableGeneric");
            btn.disabled = true;
            break;
          case "downloading":
            el.textContent = tr("settings.status.downloading", { percent: s.percent });
            btn.disabled = true;
            break;
          case "downloaded":
            el.textContent = tr("settings.status.downloaded");
            btn.disabled = false;
            break;
          case "error":
            el.textContent = tr("settings.status.error");
            btn.disabled = false;
            break;
          case "not-available":
          case "idle":
          default:
            el.textContent = tr("settings.status.upToDate");
            btn.disabled = false;
            break;
        }
      }
      async function init() {
        const s = await window.engram.getSettings();
        const localeSelect = $("locale");
        localeSelect.innerHTML = "";
        Object.entries(s.localeLabels).forEach(([code, label]) => {
          const opt = document.createElement("option");
          opt.value = code;
          opt.textContent = label;
          localeSelect.appendChild(opt);
        });
        localeSelect.value = s.locale;
        await setLocaleMessages(s.locale);
        document.querySelector(`input[name="mode"][value="${s.mode}"]`).checked = true;
        $("offline-base").value = s.offline.baseUrl;
        $("offline-model").value = s.offline.model;
        $("online-base").value = s.online.baseUrl;
        $("online-model").value = s.online.model;
        $("key-hint").textContent =
          (s.hasApiKey ? tr("settings.keyHintSet") : tr("settings.keyHintMissing")) +
          " " +
          (s.encryptionAvailable
            ? tr("settings.keyHintEncrypted")
            : tr("settings.keyHintSession"));
        applyMode(s.mode);
      }
      document.querySelectorAll('input[name="mode"]').forEach((el) =>
        el.addEventListener("change", (e) => applyMode(e.target.value)),
      );
      $("locale").addEventListener("change", async (e) => {
        await setLocaleMessages(e.target.value);
      });
      async function initAbout() {
        appInfo = await window.engram.getAppInfo();
        $("app-version").textContent = appInfo.version;
        renderUpdateStatus(appInfo, appInfo.updateStatus);
        window.engram.onUpdateStatus((status) => renderUpdateStatus(appInfo, status));
        $("check-updates").addEventListener("click", () => {
          if (appInfo.updatesSupported) window.engram.checkForUpdates();
        });
      }
      $("cancel").addEventListener("click", () => window.engram.close());
      $("save").addEventListener("click", async () => {
        $("status").textContent = tr("settings.status.restarting");
        const mode = document.querySelector('input[name="mode"]:checked').value;
        const res = await window.engram.saveSettings({
          mode,
          locale: $("locale").value,
          offline: { baseUrl: $("offline-base").value, model: $("offline-model").value },
          online: {
            baseUrl: $("online-base").value,
            model: $("online-model").value,
            apiKey: $("online-key").value,
          },
        });
        if (!res.ok) {
          $("status").textContent =
            tr("settings.status.errorPrefix") + (res.error || "unknown");
        }
      });
      init().then(initAbout);
    </script>
  </body>
</html>
