appId: ai.pyri.engram
productName: ENGRAM
executableName: engram
copyright: ENGRAM — PYRI AI Persona Framework

directories:
  output: release
  buildResources: build

artifactName: ${productName}-${version}-${arch}.${ext}

# Native modules: none. PGlite ships as prebuilt wasm via extraResources.
npmRebuild: false
asar: true

# Only the Electron main/preload bundle goes inside the asar archive.
files:
  - dist/**/*
  - package.json

# Everything the embedded server needs lives outside the asar, under
# process.resourcesPath at runtime (server/, web/, drizzle/).
extraResources:
  - from: resources/server
    to: server
  # The server bundle externalizes @electric-sql/pglite and imports it as a bare
  # ESM specifier, so it must resolve from a real node_modules dir next to the
  # bundle. electron-builder strips `node_modules` when copying a directory
  # `from`, so the pglite package is copied via its own entry (whose `from` is
  # the package dir itself, not a node_modules dir) to land it in place.
  - from: resources/server/node_modules/@electric-sql/pglite
    to: server/node_modules/@electric-sql/pglite
  - from: resources/web
    to: web
  - from: resources/drizzle
    to: drizzle

linux:
  target:
    - AppImage
    - deb
  category: Science
  synopsis: PYRI — AI persona framework (offline-capable)

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils

mac:
  target:
    - dmg
  category: public.app-category.productivity
  # Signing + notarization. Signing is opt-in via env: provide a Developer ID
  # certificate through CSC_LINK / CSC_KEY_PASSWORD. With no certificate present
  # electron-builder skips signing entirely (and therefore notarization too), so
  # local/unsigned builds keep working.
  #
  # Gatekeeper on modern macOS requires BOTH a Developer ID signature AND Apple
  # notarization — a signed-but-unnotarized app still shows the "unidentified
  # developer" / malware warning. Notarization needs the hardened runtime, which
  # in turn needs the JIT/library entitlements below or the notarized app crashes
  # at launch.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # notarize runs only after a successful sign, and only when Apple credentials
  # are present in the environment (APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD +
  # APPLE_TEAM_ID, or the APPLE_API_KEY trio); otherwise it is skipped gracefully.
  notarize: true

win:
  target:
    - nsis
  # Authenticode signing is opt-in via WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD
  # (electron-builder maps these to the certificate file + password). With no
  # certificate the executable is left unsigned. A timestamp countersignature
  # keeps the signature valid after the signing certificate eventually expires,
  # and SHA-256 is required for SmartScreen to trust the signature.
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
