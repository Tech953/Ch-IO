appId: ai.pyri.engram
productName: ENGRAM
executableName: engram
copyright: ENGRAM — PYRI AI Persona Framework

directories:
  output: release
  buildResources: build

artifactName: ${productName}-${version}-${arch}.${ext}

# Release feed for auto-update (electron-updater). At package time
# electron-builder bakes provider+owner+repo into app-update.yml inside the app,
# and `--publish` (see .github/workflows/desktop-build.yml) uploads the
# installers + the *-latest*.yml update manifests to a GitHub Release for the
# pushed tag. owner/repo are left unset so they are auto-detected from the git
# remote / GITHUB_REPOSITORY in CI; set them explicitly here if you fork/rename.
#
# releaseType is `draft` (not `release`): each OS matrix job uploads into a
# hidden draft Release, so a partially-uploaded release is never publicly
# visible and concurrent first-creators don't race a public release into
# existence. A final CI job (`publish`, needs: build) flips the draft to public
# once all three OS installers + manifests are attached. The published release
# is still public and requires no GitHub login to download.
publish:
  provider: github
  releaseType: draft

# Native modules: none. PGlite ships as prebuilt wasm via extraResources.
npmRebuild: false
asar: true

# Only the Electron main/preload bundle goes inside the asar archive.
files:
  - dist/**/*
  - package.json

# Everything the embedded server needs lives outside the asar, under
# process.resourcesPath at runtime (server/, web/, drizzle/).
extraResources:
  - from: resources/server
    to: server
  # notarize runs only after a successful sign, and only when Apple credentials
  # are present in the environment (APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD +
  # APPLE_TEAM_ID, or the APPLE_API_KEY trio); otherwise it is skipped gracefully.

win:
  target:
    - nsis
    # Portable .zip alongside the NSIS installer: an unpacked, no-install build
    # the user extracts and runs (engram.exe) without admin rights, for users who
    # can't or don't want to run the installer. NOTE: the Windows update feed
    # (latest.yml) targets the NSIS .exe, and setupAutoUpdates() in main.ts gates
    # only on app.isPackaged — so a portable copy that checks for updates would
    # fetch and run that .exe installer. The installer is the primary
    # auto-updating distribution; the .zip is for no-install use. Adds no per-OS
    # cost and ships in the same release.
    - zip
  # Authenticode signing is opt-in via WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD
  # (electron-builder maps these to the certificate file + password). With no
  # certificate the executable is left unsigned. A timestamp countersignature
  # keeps the signature valid after the signing certificate eventually expires,
  # and SHA-256 is required for SmartScreen to trust the signature.
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Show the app under Start Menu > Programs > ENGRAM so users can clearly
  # identify the install folder rather than having the shortcut land at the
  # Programs root.
  menuCategory: true
  # Explicit shortcut label matches the product name exactly.
  shortcutName: "ENGRAM"
  # Default installation directory shown on the Destination Folder page.
  # Uses the branded product name so the path reads clearly
  # (e.g. C:\Users\<user>\AppData\Local\Programs\ENGRAM).
  installDir: "$LOCALAPPDATA\\Programs\\ENGRAM"
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerLanguages:
    - en_US
    - es_ES
    - fr_FR
